<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShoPperZ</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <header>

        <div class="logo">
            <a href="#">ShoPperZ</a>
        </div>

        <!-- MOBILE MENU -->
        <div class="menu">
            <ion-icon name="close-outline" class="close"></ion-icon>

            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">SHOP</a></li>
                <li><a href="#">OUR PRODUCTS</a></li>
                <li><a href="#">CONTACT US</a></li>
                <li><a href="#">ABOUT US</a></li>
            </ul>
        </div>

        <!-- SEARCH -->
        <div class="search">
            <input type="text" placeholder="Search products" id="input">
            <ion-icon name="search-outline"></ion-icon>
        </div>

        <!-- DESKTOP NAV -->
        <div class="heading">
            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">SHOP</a></li>
                <li><a href="#">OUR PRODUCTS</a></li>
                <li><a href="#">CONTACT US</a></li>
                <li><a href="#">ABOUT US</a></li>
            </ul>
        </div>

        <!-- HAMBURGER -->
        <div class="heading1">
            <ion-icon name="menu-outline" class="ham"></ion-icon>
        </div>

    </header>

    <section id="home">
        <div class="section">
            <div class="section1">
                <div class="img-slider">
                    <img src="https://images.pexels.com/photos/6347888/pexels-photo-6347888.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=750&w=1260"
                        alt="Shirts" loading="lazy" class="img">

                    <img src="https://images.pexels.com/photos/3962294/pexels-photo-3962294.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=750&w=1260"
                        alt="Fruits" loading="lazy" class="img">

                    <img src="https://images.pexels.com/photos/2292953/pexels-photo-2292953.jpeg?auto=compress&cs=tinysrgb&dpr=2&w=500"
                        alt="Sale" loading="lazy" class="img">

                    <img src="https://images.pexels.com/photos/1229861/pexels-photo-1229861.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=750&w=1260"
                        alt="Laptop" loading="lazy" class="img">

                    <img src="https://images.pexels.com/photos/1598505/pexels-photo-1598505.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=750&w=1260"
                        alt="Shoes" loading="lazy" class="img">
                </div>
            </div>
        </div>
    </section>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>

</html>
